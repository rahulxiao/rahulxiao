<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="A visual-novel dialogue box. Rahul says: It&#39;s 3 AM. The bug is gone. I have no idea what I changed. / One more feature, one more fix, one more deploy. Then I&#39;ll sleep. / It works on my machine. Shipping my machine is the next feature.">
<style>
.slot{animation:slot 15s linear infinite}
@keyframes slot{0%,31%{opacity:1}33.4%,100%{opacity:0}}
.cover{animation:cover 15s steps(40) infinite}
@keyframes cover{0%{transform:translateX(0)}14%,100%{transform:translateX(1080px)}}
.next{animation:next 1s ease-in-out infinite}@keyframes next{50%{transform:translateY(5px)}}
.curtain{transform-box:fill-box;transform-origin:top;animation:curtain 6s ease-in-out infinite}@keyframes curtain{50%{transform:skewX(3deg)}}
.lamp{animation:lamp 4s ease-in-out infinite}@keyframes lamp{50%{opacity:.7}}
.tw{animation:tw 3s ease-in-out infinite alternate}@keyframes tw{from{opacity:.1}}
.glowpulse{animation:gp 3.2s ease-in-out infinite}@keyframes gp{0%,100%{opacity:.6}50%{opacity:1}}
</style>
<defs>
  <linearGradient id="room" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17123a"/><stop offset="1" stop-color="#241848"/></linearGradient>
  <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0a1f"/><stop offset="1" stop-color="#3a1f5c"/></linearGradient>
  <radialGradient id="lampg"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".45"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient>
  <radialGradient id="face"><stop offset="0" stop-color="#67e8f9" stop-opacity=".55"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></radialGradient>
  <clipPath id="dc"><rect width="1200" height="330" rx="18"/></clipPath>
  <clipPath id="wc"><rect x="120" y="34" width="300" height="160" rx="4"/></clipPath>
</defs>
<g clip-path="url(#dc)">
<rect width="1200" height="330" fill="url(#room)"/>
<!-- window to the night outside -->
<g clip-path="url(#wc)">
  <rect x="120" y="34" width="300" height="160" fill="url(#win)"/>
  <circle cx="244" cy="86" r=".9" fill="#fff" class="tw" style="animation-delay:0.0s"/><circle cx="294" cy="45" r=".9" fill="#fff" class="tw" style="animation-delay:0.5s"/><circle cx="198" cy="114" r=".9" fill="#fff" class="tw" style="animation-delay:0.3s"/><circle cx="132" cy="50" r=".9" fill="#fff" class="tw" style="animation-delay:0.6s"/><circle cx="270" cy="141" r=".9" fill="#fff" class="tw" style="animation-delay:0.3s"/><circle cx="313" cy="127" r=".9" fill="#fff" class="tw" style="animation-delay:1.2s"/><circle cx="244" cy="44" r=".9" fill="#fff" class="tw" style="animation-delay:1.4s"/><circle cx="312" cy="121" r=".9" fill="#fff" class="tw" style="animation-delay:0.1s"/><circle cx="370" cy="100" r=".9" fill="#fff" class="tw" style="animation-delay:0.4s"/><circle cx="190" cy="41" r=".9" fill="#fff" class="tw" style="animation-delay:0.9s"/><circle cx="167" cy="51" r=".9" fill="#fff" class="tw" style="animation-delay:2.0s"/><circle cx="131" cy="78" r=".9" fill="#fff" class="tw" style="animation-delay:3.0s"/><circle cx="364" cy="71" r=".9" fill="#fff" class="tw" style="animation-delay:0.0s"/><circle cx="354" cy="128" r=".9" fill="#fff" class="tw" style="animation-delay:1.7s"/><circle cx="346" cy="91" r=".9" fill="#fff" class="tw" style="animation-delay:2.3s"/><circle cx="260" cy="48" r=".9" fill="#fff" class="tw" style="animation-delay:2.3s"/><circle cx="129" cy="87" r=".9" fill="#fff" class="tw" style="animation-delay:0.6s"/><circle cx="171" cy="113" r=".9" fill="#fff" class="tw" style="animation-delay:2.4s"/><circle cx="228" cy="78" r=".9" fill="#fff" class="tw" style="animation-delay:2.5s"/><circle cx="156" cy="83" r=".9" fill="#fff" class="tw" style="animation-delay:2.6s"/><circle cx="301" cy="146" r=".9" fill="#fff" class="tw" style="animation-delay:0.7s"/><circle cx="142" cy="141" r=".9" fill="#fff" class="tw" style="animation-delay:2.7s"/><circle cx="128" cy="134" r=".9" fill="#fff" class="tw" style="animation-delay:1.0s"/><circle cx="334" cy="107" r=".9" fill="#fff" class="tw" style="animation-delay:1.5s"/><circle cx="167" cy="77" r=".9" fill="#fff" class="tw" style="animation-delay:0.1s"/><circle cx="369" cy="125" r=".9" fill="#fff" class="tw" style="animation-delay:2.0s"/>
  <circle cx="350" cy="80" r="22" fill="#fff4e0"/>
  <rect x="120" y="154" width="40" height="40" fill="#0d0a1f"/><rect x="158" y="132" width="30" height="62" fill="#0d0a1f"/><rect x="190" y="164" width="46" height="30" fill="#0d0a1f"/><rect x="238" y="140" width="26" height="54" fill="#0d0a1f"/><rect x="266" y="158" width="50" height="36" fill="#0d0a1f"/><rect x="318" y="124" width="34" height="70" fill="#0d0a1f"/><rect x="354" y="150" width="66" height="44" fill="#0d0a1f"/>
</g>
<rect x="120" y="34" width="300" height="160" rx="4" fill="none" stroke="#3b2a6b" stroke-width="6"/>
<rect x="267" y="34" width="6" height="160" fill="#3b2a6b"/><rect x="120" y="111" width="300" height="6" fill="#3b2a6b"/>
<path class="curtain" d="M92,26 L150,26 Q140,110 152,206 L100,206 Q86,110 92,26Z" fill="#4a2462"/>
<path class="curtain" style="animation-delay:-3s" d="M390,26 L448,26 Q454,110 440,206 L388,206 Q400,110 390,26Z" fill="#4a2462"/>
<rect x="84" y="20" width="372" height="8" rx="4" fill="#2a1d52"/>
<!-- desk lamp glow -->
<circle cx="640" cy="120" r="170" fill="url(#lampg)" class="lamp"/>
<path d="M610,70 L670,70 L690,104 L590,104Z" fill="#2a1d52"/><rect x="637" y="104" width="6" height="60" fill="#2a1d52"/>
<!-- me, a little sleepy -->
<ellipse cx="930" cy="150" rx="110" ry="90" fill="url(#face)" class="glowpulse"/>
<g fill="#0a0818" stroke="#7d6bb8" stroke-opacity=".6" stroke-width="1.6">
  <path d="M860,230 C860,180 890,160 930,160 C970,160 1000,180 1000,230Z"/>
  <path d="M895,118 C895,84 915,66 932,66 C952,66 972,84 970,118 C969,140 952,156 932,156 C912,156 896,140 895,118Z"/>
</g>
<path d="M914,120 q8,4 16,0 M944,120 q8,4 16,0" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity=".8"/>
<!-- dialogue box -->
<rect x="40" y="200" width="1120" height="108" rx="14" fill="#120d2b" stroke="#f472b6" stroke-width="2"/>
<rect x="46" y="206" width="1108" height="96" rx="10" fill="none" stroke="#fff" stroke-opacity=".08"/>
<g transform="translate(70,186)">
  <rect width="128" height="30" rx="8" fill="#f472b6"/>
  <text x="64" y="21" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="3" fill="#fff" text-anchor="middle">RAHUL</text>
</g>

<g class="slot" style="animation-delay:0s">
  <text x="96" y="262" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#f5f0ff">It's 3 AM. The bug is gone. I have no idea what I changed.</text>
  <rect x="80" y="232" width="1060" height="44" fill="#120d2b" class="cover" style="animation-delay:0s"/>
</g>
<g class="slot" style="animation-delay:-10s">
  <text x="96" y="262" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#f5f0ff">One more feature, one more fix, one more deploy. Then I'll sleep.</text>
  <rect x="80" y="232" width="1060" height="44" fill="#120d2b" class="cover" style="animation-delay:-10s"/>
</g>
<g class="slot" style="animation-delay:-5s">
  <text x="96" y="262" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#f5f0ff">It works on my machine. Shipping my machine is the next feature.</text>
  <rect x="80" y="232" width="1060" height="44" fill="#120d2b" class="cover" style="animation-delay:-5s"/>
</g>
<g class="next"><path d="M1128,282 l12,0 l-6,8z" fill="#f9a8d4"/></g>
<text x="1148" y="44" font-family="'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="16" letter-spacing="3" fill="#cbbff0" text-anchor="end">03:15 · STILL AWAKE</text>
</g>
</svg>