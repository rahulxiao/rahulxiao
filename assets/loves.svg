<rect x="-72" y="-44" width="144" height="92" rx="9" fill="#0b0a1f" stroke="#67e8f9" stroke-width="2"/>
<rect x="-72" y="-44" width="144" height="18" rx="9" fill="#1a1538"/><rect x="-72" y="-32" width="144" height="6" fill="#1a1538"/>
<circle cx="-60" cy="-35" r="3" fill="#f87171"/><circle cx="-50" cy="-35" r="3" fill="#ffcf7a"/><circle cx="-40" cy="-35" r="3" fill="#4ade80"/>
<rect x="-58" y="-14" width="54" height="5" rx="2" fill="#f9a8d4" class="type" style="animation-delay:0.0s"/><rect x="-46" y="-3" width="72" height="5" rx="2" fill="#67e8f9" class="type" style="animation-delay:0.5s"/><rect x="-46" y="8" width="40" height="5" rx="2" fill="#ddd6fe" class="type" style="animation-delay:1.0s"/><rect x="-34" y="19" width="60" height="5" rx="2" fill="#ffcf7a" class="type" style="animation-delay:1.5s"/><rect x="-58" y="30" width="30" height="5" rx="2" fill="#f9a8d4" class="type" style="animation-delay:2.0s"/>
<rect x="-58" y="41" width="8" height="2" fill="#67e8f9" class="blink"/></g>
  <text x="28" y="194" font-family="'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="15" letter-spacing="3" fill="#f9a8d4">APPS &amp; WEB</text>
  <text x="28" y="228" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#fff">Idea to real thing</text>
  <text x="28" y="266" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#ddd6fe">Websites, mobile apps and</text><text x="28" y="293" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#ddd6fe">small tools. When something</text><text x="28" y="320" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#ddd6fe">annoys me, I'd rather build</text><text x="28" y="347" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#ddd6fe">the fix than wait for one.</text>
</g></g>
