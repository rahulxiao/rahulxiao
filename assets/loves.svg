  <text x="28" y="194" font-family="'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="15" letter-spacing="3" fill="#f9a8d4">TRAVELING</text>
  <text x="28" y="228" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#fff">Somewhere new</text>
  <text x="28" y="266" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#ddd6fe">New places, new food, new</text><text x="28" y="293" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#ddd6fe">people. It's the best reset</text><text x="28" y="320" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#ddd6fe">button I know, and I come</text><text x="28" y="347" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#ddd6fe">back full of ideas.</text>
</g></g>
