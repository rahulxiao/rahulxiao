  <g transform="translate(180.0,84)">
<rect x="-54" y="-40" width="108" height="22" rx="4" fill="#1a1538" stroke="#3b2a6b" stroke-width="1.5"/><rect x="-44" y="-32" width="40" height="3" rx="1.5" fill="#4c3d85"/><rect x="-44" y="-26" width="28" height="3" rx="1.5" fill="#4c3d85"/><circle cx="30" cy="-29" r="3.2" fill="#4ade80" class="led" style="animation-delay:0.00s"/><circle cx="42" cy="-29" r="3.2" fill="#67e8f9" class="led" style="animation-delay:0.20s"/><rect x="-54" y="-12" width="108" height="22" rx="4" fill="#1a1538" stroke="#3b2a6b" stroke-width="1.5"/><rect x="-44" y="-4" width="40" height="3" rx="1.5" fill="#4c3d85"/><rect x="-44" y="2" width="28" height="3" rx="1.5" fill="#4c3d85"/><circle cx="30" cy="-1" r="3.2" fill="#4ade80" class="led" style="animation-delay:0.45s"/><circle cx="42" cy="-1" r="3.2" fill="#67e8f9" class="led" style="animation-delay:0.50s"/><rect x="-54" y="16" width="108" height="22" rx="4" fill="#1a1538" stroke="#3b2a6b" stroke-width="1.5"/><rect x="-44" y="24" width="40" height="3" rx="1.5" fill="#4c3d85"/><rect x="-44" y="30" width="28" height="3" rx="1.5" fill="#4c3d85"/><circle cx="30" cy="27" r="3.2" fill="#4ade80" class="led" style="animation-delay:0.90s"/><circle cx="42" cy="27" r="3.2" fill="#67e8f9" class="led" style="animation-delay:0.80s"/>
<path d="M-54,46 H54" stroke="#f9a8d4" stroke-width="2" stroke-dasharray="4 6" class="route"/></g>
  <text x="28" y="194" font-family="'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="15" letter-spacing="3" fill="#f9a8d4">SYSTEMS</text>
  <text x="28" y="228" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#fff">Under the hood</text>
  <text x="28" y="266" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#ddd6fe">APIs, databases, servers and</text><text x="28" y="293" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#ddd6fe">deploys. I like making the</text><text x="28" y="320" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#ddd6fe">invisible parts fast,</text><text x="28" y="347" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#ddd6fe">reliable and easy to</text><text x="28" y="374" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#ddd6fe">maintain.</text>
</g></g>
